<form (submit)="onSubmit($event)">
    <mat-card>
        <mat-card-header class="h-15 flex items-center justify-center mb-4 bg-blue-800 text-white">
            <mat-card-title>Login</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <div class="flex flex-col">
            <mat-form-field appearance="fill" class="mt-4 mx-5">
                <mat-label>Username</mat-label>
                <input matInput [formField]="_form.cedula">
            </mat-form-field>
            @if(_form.cedula().touched() && _form.cedula().invalid()) {
                @for(error of _form.cedula().errors(); track error.kind) {
                    <mat-error class="ml-5">{{error.message}}</mat-error>
                }
            }
            <mat-form-field appearance="fill" class="mt-4 mx-5">
                <mat-label>Password</mat-label>
                <input matInput type="password" [formField]="_form.passw">
            </mat-form-field>                
            @if(_form.passw().touched() && _form.passw().invalid()) {
                @for(error of _form.passw().errors(); track error) {
                    <mat-error class="ml-5">{{error.message}}</mat-error>
                }
            }
            </div>
        </mat-card-content>
        
        <mat-card-actions class="mb-5">
            <button type="submit" matFab extended color="primary" class="flex flex-1 mx-5"
            [disabled]="_form().invalid()">
                Login
            </button>
        </mat-card-actions>
        
    </mat-card>
</form>
