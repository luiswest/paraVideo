<section class="flex">
    <mat-toolbar class="header">
        <button matIconButton class="botonMenu" (click)="sidenav.toggle();"
                [matTooltip]="sidenav.opened ? 'Cerrar menu' : 'Abrir menu'">
                <mat-icon>menu</mat-icon>
        </button>
        <div class="me-4 flex">
            <button mat-icon-button [matMenuTriggerFor]="menu" #menuTrigger class="botonMenu">
                <mat-icon>person</mat-icon>
            </button>
        </div>
        <mat-menu #menu="matMenu">
            <button mat-menu-item>Iniciar Sesión</button>
            <button mat-menu-item>Cerrar Sesión</button>
            <mat-divider></mat-divider>
            <button mat-menu-item>Cambiar contraseña</button>
            
        </mat-menu>
    </mat-toolbar>

    <mat-sidenav-container class="container">
        <mat-sidenav #sidenav mode="side" opened class="sidenav">
            <!-- La lista solo se muestra si el usuario está autenticado -->
            <mat-nav-list>

                <mat-list-item>
                    <a href="" [routerLink]="['home']">
                    <mat-icon>home</mat-icon>
                    Inicio
                    </a>
                </mat-list-item>
                
                <mat-list-item>
                    <a href="" [routerLink]="['cliente']">
                        <mat-icon>group</mat-icon>
                        Clientes
                    </a>
                </mat-list-item>
                <mat-list-item>
                    <mat-icon>engineering</mat-icon>
                    Mecánicos
                </mat-list-item>
                <mat-list-item>
                    <mat-icon>directions_car</mat-icon>
                    Vehículos
                </mat-list-item>
                <mat-list-item>
                    <mat-icon>build</mat-icon>
                    Servicios
                </mat-list-item>

            </mat-nav-list>

        </mat-sidenav>

        <mat-sidenav-content>

            <router-outlet />
        </mat-sidenav-content>

    </mat-sidenav-container>

    <mat-toolbar class="footer">
        <span class="font-bold! text-[0.65rem]!">
            @2026 Taller Automotriz. Todos los derechos reservados.
        </span>
    </mat-toolbar>

</section>
