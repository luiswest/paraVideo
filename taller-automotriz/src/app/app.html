
<section class="flex">

              class="botonMenu"

            <div class="me-4 flex">
        <button mat-icon-button [matMenuTriggerFor]="menu" #menuTrigger class="botonMenu">
            <mat-icon>person</mat-icon>
        </button>
        <!--<span>{{srvAuth.userActualS().nombre}}</span>-->
    </div>
    <mat-menu #menu="matMenu">
        <button mat-menu-item >Iniciar Sesión</button>

        <mat-divider></mat-divider>
        <button mat-menu-item>Cambiar Contraseña</button>
    </mat-menu>
  </mat-toolbar>

  <mat-sidenav-container class="container">

      <mat-nav-list>
        <mat-list-item>
          <mat-icon>home</mat-icon>

        </mat-list-item>
        <mat-list-item>
          <mat-icon>group</mat-icon>
          Item 2
        </mat-list-item>
        <mat-list-item>
          <mat-icon>engineering</mat-icon>
          Item 2
        </mat-list-item>
        <mat-list-item>
          <mat-icon>handyman</mat-icon>
          Item 2
        </mat-list-item>
        <mat-list-item>
          <mat-icon>contacts</mat-icon>
          Item 2
        </mat-list-item>            
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <app-clientes></app-clientes>
      <router-outlet />
    </mat-sidenav-content>

  </mat-sidenav-container>

  <mat-toolbar class="footer">Footer</mat-toolbar>
    

    
</section>
